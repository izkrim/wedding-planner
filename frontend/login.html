<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Wedding Planner</title>
  <!-- Google Fonts (Opsional, untuk judul lebih cantik) -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <!-- Panggil CSS Auth -->
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-page">
  <!-- LATAR BELAKANG KOLASE -->
    <div class="bg-collage">
      <img src="./images/2.jpeg" class="collage-img img1" alt="">
      <img src="./images/6.jpeg" class="collage-img img2" alt="">
      <img src="./images/4.jpeg" class="collage-img img3" alt="">
      <img src="./images/3.jpeg" class="collage-img img4" alt="">
      <img src="./images/5.jpeg" class="collage-img img5" alt="">
    </div>
  <div class="auth-card">
    <h1>💒 Wedding Planner</h1>
    <p>Masuk untuk merencanakan hari bahagia Anda</p>
    
    <form id="login-form">
      <input type="email" id="email" placeholder="Alamat Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" id="btn-login">Masuk</button>
    </form>
    
    <p class="auth-footer">
      Belum punya akun? <a href="./register.html">Daftar di sini</a>
    </p>
    <p id="msg" class="msg"></p>
  </div>

  <script type="module">
    import { api } from './js/api.js';
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const msg = document.getElementById('msg');
      
      btn.textContent = 'Memproses...';
      btn.disabled = true;
      msg.textContent = '';

      try {
        const data = await api('/auth/login', 'POST', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = './dashboard.html';
      } catch (err) {
        msg.textContent = err.message;
        btn.textContent = 'Masuk';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
