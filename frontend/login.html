<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Wedding Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-page">
  
  <!-- LATAR BELAKANG KOLASE -->
  <div class="bg-collage">
    <img src="./images/foto1.jpg" class="collage-img img1" alt="">
    <img src="./images/foto2.jpg" class="collage-img img2" alt="">
    <img src="./images/foto3.jpg" class="collage-img img3" alt="">
    <img src="./images/foto4.jpg" class="collage-img img4" alt="">
    <img src="./images/foto5.jpg" class="collage-img img5" alt="">
  </div>

  <!-- KARTU KACA -->
  <div class="auth-card">
    <h1>💒 Wedding Planner</h1>
    <p>Masuk untuk merencanakan hari bahagia Anda</p>
    
    <form id="login-form">
      <input type="email" id="email" placeholder="Alamat Email" required>
      <input type="password" id="password" placeholder="Password" required>
      
      <!-- Checkbox Remember Me -->
      <div class="remember-me-group">
        <input type="checkbox" id="remember-me">
        <label for="remember-me">Ingat Saya (30 Hari)</label>
      </div>
      
      <button type="submit" id="btn-login">Masuk</button>
    </form>
    
    <p class="auth-footer">
      Belum punya akun? <a href="./register.html">Daftar di sini</a>
    </p>
    <p id="msg" class="msg"></p>
  </div>

  <script type="module">
    import { api } from './js/api.js';
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const msg = document.getElementById('msg');
      
      btn.textContent = 'Memproses...';
      btn.disabled = true;
      msg.textContent = '';

      try {
        const data = await api('/auth/login', 'POST', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          rememberMe: document.getElementById('remember-me').checked
        });
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = './dashboard.html';
      } catch (err) {
        msg.textContent = err.message;
        btn.textContent = 'Masuk';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
